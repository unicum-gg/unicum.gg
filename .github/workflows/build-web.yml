# Builds the web image and publishes it to ghcr.io, so the production host never
# builds again.
#
# The host runs Railpack on the same 8 cores that serve the site. On 2026-08-21
# that build filled the machine's swap and the kernel's OOM killer took Traefik
# and then Redis with it. Building here costs nothing (Actions is unmetered on
# public repositories) and leaves the host with a pull.
#
# Measured on the host on 2026-10-23, since the 30 minutes this was written
# against is no longer the figure: a deploy is 13m57, of which 13m04 is the image
# and 53s is everything else. The codegen inside it is 1m44 and a local
# `next build` with dependencies already installed is 3m46, so the hour-long
# deploys are not the build. Two things make them: `concurrent_builds: 1` on the
# server, which serialises the three services a push triggers, and the empty
# builder cache this workflow's `type=gha` exists to fix. Two consecutive builds
# of adjacent commits, the second starting 39 seconds after the first finished
# with an identical lockfile, took 13m42 and 13m36, a difference of 0.7%.
name: Build web image

# Manual only, until the last problem is solved.
#
# WHERE THIS STANDS
# The image builds: dependencies install, the app compiles and typechecks, and
# most pages prerender with real data. What does not hold is the long queries.
# `/coverage` and the `clans/top` leaderboards run for minutes (the build
# deliberately disables Postgres parallel workers, which roughly doubles them),
# and those connections come back ECONNRESET across the tunnel while short ones
# are fine. `buildSafe` catches it and prerenders empty shells, so the image
# would ship with holes in it. That is worse than a slow build, hence no
# automatic trigger yet.
#
# Not the cause, ruled out by measurement: concurrency (four workers and two give
# 37 and 35 resets), volume (four concurrent bulk streams over the direct port
# are fine), Postgres (logs no connection error at all), and the nginx fronting
# 5432 (1024 connections, 3600s timeout).
#
# Next thing to try: keep the parallel workers enabled in CI. The reason they are
# off is /dev/shm pressure from ~24 concurrent prerenders on the deploy host, and
# with two workers here that pressure is not the same problem.
#
# The push trigger is on as of 2026-10-26, after two consecutive runs came out
# with zero "prerendering empty": 482/482 pages, no ECONNRESET, 18 min on a cold
# layer cache and 9 on a warm one. It had been dispatch-only since 2026-08-22.
#
# It BUILDS on every push and deploys nothing. The host still builds and still
# deploys, exactly as before, so this changes nothing about how production is
# served: it publishes an image beside it and makes the pipeline visible on real
# commits rather than on the dispatches of whoever remembers to run one. That is
# the whole point of turning it on before the switch, because the failure this
# pipeline actually had was nobody noticing it was broken for two months.
#
# The paths mirror the Coolify app's own `watch_paths`, so the two cannot
# disagree about what counts as a change to the web app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # The recipe itself, which neither Coolify nor the app tree covers.
      - ".github/workflows/build-web.yml"

# One build at a time on this branch, newest wins.
#
# Load-bearing now that the deploy is a pull of `latest`: two pushes in quick
# succession each move that tag, and without this the slower build moves it
# back onto the older commit after the faster one has already deployed. There
# were six pushes to main on 2026-11-11, several minutes apart, so this is the
# ordinary case rather than a corner of it. Cancelling also stops paying for a
# build whose image nothing will ever deploy.
concurrency:
  group: build-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-web
  # The production host, which the build tunnels to Postgres through.
  #
  # A secret rather than a literal, because this repository is public and the
  # origin answers the site directly on its address: everything Cloudflare does
  # for us is optional for whoever knows it. That it is already discoverable
  # through the `*.sslip.io` certificates Coolify mints, and therefore in the
  # Certificate Transparency logs for good, is a reason to lock the origin down,
  # never a reason to publish it once more ourselves.
  #
  # Declared once because it had been written twice and both were left behind:
  # this workflow was parked on 2026-08-22 and the host moved from OVH to Netcup
  # on 2026-08-30, eight days later, so the address under it changed while
  # nothing ran to notice. Any run since died in its first minute on an SSH that
  # could not resolve, which looks nothing like the problem it is actually parked
  # on and reads as the tunnel approach itself not working. `CI_TUNNEL_KEY` has
  # to carry the matching restricted entry on whatever host this names, which is
  # the other half of a move and lives outside the repository.
  CI_TUNNEL_HOST: ${{ secrets.CI_TUNNEL_HOST }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The build prerenders pages against the live database and can reach out to
    # Wargaming, so it is slower than a pure compile. The default 360 minute
    # ceiling would let a wedged build sit there all day.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # `network=host` on the driver itself, not just on the build.
      #
      # The default docker-container driver runs BuildKit inside its own
      # container, so `network: host` on the build only joins the RUN steps to
      # THAT container's stack, where 127.0.0.1 is the buildkit container and the
      # tunnel is nowhere to be found. Putting the driver on the host network
      # makes the two localhosts the same one.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build prerenders pages against the live database, and a runner cannot
      # open 5432 on the host. Two separate reasons, and only the second is ours.
      # Measured from a runner on 2026-08-21: no SYN arrived at all, tcpdump on
      # the host seeing nothing while 22, 80 and 443 answered in milliseconds, so
      # something between GitHub's ranges and the machine was dropping it. That
      # observation was specific to those ranges and was never true in general,
      # which the header used to imply. Since 2026-10-26 it is true in general
      # and because we made it so: 5432 and 6379 are closed to everything but one
      # address, after 19,999 authentication failures in 24 hours from three
      # hosts, so no runner is ever getting a direct connection again.
      #
      # So Postgres is reached through SSH rather than exposed on another port,
      # which is now the only way in rather than a workaround for one network.
      #
      # The key is restricted on the server side to exactly this and nothing more
      # (`restrict,port-forwarding,permitopen="127.0.0.1:5432",command="/bin/false"`):
      # it cannot open a shell, and it cannot forward anywhere except Postgres.
      # That makes this stricter than the public port it replaces, not looser.
      #
      # `port-forwarding` is not redundant beside `permitopen`, which is the one
      # thing here that cannot be read off the manual and has to be measured.
      # `restrict` disables forwarding outright and `permitopen` only narrows
      # which targets a key that may forward is allowed to reach, so it does not
      # grant back what `restrict` took: without it the channel is refused for
      # Postgres too. The refusal is also the shape that misleads, since the
      # listener is local and binds whatever the server decides, so `nc -z`
      # reports a tunnel that is up and the connection resets on the first byte.
      # Verified on the host on 2026-10-26: Postgres answers an SSLRequest
      # through the forward, 6379 resets, and `id` returns nothing at all.
      - name: Tunnel to postgres
        env:
          CI_TUNNEL_KEY: ${{ secrets.CI_TUNNEL_KEY }}
        run: |
          # An absent secret would otherwise become `root@`, which fails with
          # a message about the local user rather than about the missing host.
          if [ -z "$CI_TUNNEL_HOST" ]; then
            echo "CI_TUNNEL_HOST is not set: add it as a repository secret"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CI_TUNNEL_KEY" > ~/.ssh/ci_tunnel
          chmod 600 ~/.ssh/ci_tunnel
          ssh-keyscan -H "$CI_TUNNEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # ExitOnForwardFailure so a refused forward fails here, loudly, instead
          # of surfacing 20 minutes later as a build that cannot resolve its data.
          ssh -i ~/.ssh/ci_tunnel -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
              -f -N -L 5432:127.0.0.1:5432 "root@$CI_TUNNEL_HOST"
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 5432 && echo "tunnel up" && exit 0
            sleep 1
          done
          echo "tunnel did not come up"; exit 1

      # Written to a file rather than passed inline through `secrets:`, which
      # parses its entries one per line and so keeps only the first line of a
      # multi-line value. That silently handed the build an env with one variable
      # in it, and `next build` failed on the rest being undefined.
      #
      # RUNNER_TEMP sits outside the build context, so the file is never sent to
      # the daemon or captured in a layer, and the runner is destroyed with it.
      - name: Materialise build env
        env:
          WEB_BUILD_ENV: ${{ secrets.WEB_BUILD_ENV }}
        run: |
          printf '%s\n' "$WEB_BUILD_ENV" > "${RUNNER_TEMP}/build.env"
          # Names only. A count of zero here means the secret is missing or empty,
          # which is otherwise indistinguishable from a build that simply fails
          # later on for its own reasons.
          echo "variables provided: $(grep -c '=' "${RUNNER_TEMP}/build.env")"
          cut -d= -f1 "${RUNNER_TEMP}/build.env" | sort | tr '\n' ' '

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repo root, because pnpm resolves the workspace from there.
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # The revision the build stamps onto its assets, so a reader who
          # straddles a deploy is sent to one build rather than served a mix of
          # two. The context has no `.git` to read it from.
          build-args: |
            DEPLOYMENT_ID=${{ github.sha }}
          # The build needs real credentials to prerender real pages. They arrive
          # as one dotenv secret rather than a list of build args: args persist in
          # the image history, and this image is public. One secret also means a
          # new variable is a secret edit, not a workflow edit.
          secret-files: |
            build_env=${{ runner.temp }}/build.env
          # Layer cache lives with the Actions cache, so a commit that touches
          # only application code reuses the dependency install instead of
          # redoing it, which is what the host never did (`Build Cache: 0B`).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          # BuildKit sandboxes each RUN on its own network, where the tunnel's
          # 127.0.0.1:5432 does not exist. Host networking puts the build on the
          # runner's stack, which is where the forward is listening.
          network: host

      - name: Report image
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Telling Coolify to pull, which is what makes building here worth
      # anything. Until 2026-11-11 this workflow published an image and nothing
      # deployed it: the host rebuilt the same commit itself with Railpack, on
      # the same twelve cores that serve the site.
      #
      # What that cost, measured that evening: a host build holds about 1.4
      # cores for 14 to 25 minutes, and with the queue it ran most of the
      # afternoon. The origin needs ~0.5s to render a page when the machine is
      # calm and a Cloudflare miss was answering in 4.2 to 4.6 seconds, against
      # 70ms on a hit. The deploy is a `docker compose pull` now.
      #
      # It runs after the push because Coolify can only fetch an image that
      # exists, and Coolify re-reads the tag on every deployment of a prebuilt
      # image, so `latest` is the commit this job has just published rather
      # than whatever the host happens to hold. The immutable `:<sha>` tag
      # beside it is what a rollback names.
      #
      # Coolify's own git webhook is OFF on this application, and it has to
      # stay off. Left on, a push starts a deploy within seconds and pulls the
      # image of the commit BEFORE it, ten minutes before this job has one to
      # offer, and the site would run one commit behind for good.
      #
      # The instance URL and the application id are secrets for the reason
      # CI_TUNNEL_HOST is one: this repository is public, and neither the
      # control plane's address nor the handle that deploys the site is
      # something to publish ourselves.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          for name in COOLIFY_URL COOLIFY_APP_UUID COOLIFY_DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "$name is not set: add it as a repository secret"; exit 1
            fi
          done

          started=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID")

          deployment=$(printf '%s' "$started" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment" ]; then
            echo "Coolify accepted the call but named no deployment:"
            printf '%s\n' "$started"
            exit 1
          fi
          echo "deployment $deployment"

          # Waiting rather than firing and forgetting, because the failure this
          # pipeline has actually had is nobody noticing. A green run that
          # deployed nothing is the same silence under a new name.
          #
          # The ceiling is twenty minutes against a pull and a rolling update
          # that take about one, so reaching it means wedged rather than slow.
          deadline=$((SECONDS + 1200))
          status=unknown
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -sS -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r '.status // "unknown"')
            case "$status" in
              finished)
                echo "deployed"
                echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
                echo "\`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "deployment $status"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "deployment still '$status' after 20 minutes"
          exit 1
