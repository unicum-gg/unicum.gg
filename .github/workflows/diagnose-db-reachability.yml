# Throwaway diagnostic: which ports on the production host does a GitHub runner
# actually reach?
#
# Established so far: 5432 times out from a runner while 443 on the same machine
# opens in 0.14s, and tcpdump on the host sees no SYN at all during the attempt.
# So something upstream of the machine drops it, and the question becomes which
# path is open rather than who is blocking.
#
# 22 matters most: if SSH is reachable, the build can tunnel to Postgres over it
# and nothing needs to be exposed publicly.
#
# Delete once the answer is known.
name: Diagnose db reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Egress address of this runner
        run: curl -s --max-time 20 https://api.ipify.org; echo

      - name: Port sweep
        env:
          HOST: 51.255.193.62
        run: |
          for port in 22 80 443 5432 5433 6432 8443 2222 3000; do
            if nc -z -w 6 "$HOST" "$port" 2>/dev/null; then
              echo "$port OPEN"
            else
              echo "$port blocked"
            fi
          done

      - name: SSH banner, if 22 answers
        env:
          HOST: 51.255.193.62
        run: |
          # A banner proves a usable SSH path, which is all the tunnel option
          # needs. No key is used here.
          timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/22 && head -c 60 <&3" 2>/dev/null \
            || echo "(no banner)"
          echo
