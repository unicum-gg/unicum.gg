# Coolify "Docker Compose" resource. Runs one CONNECT proxy per whitelisted WG
# egress IP, on the host network so each source IP is actually bound. The app
# (worker/web) sends WG traffic through these via undici ProxyAgent, round-robin,
# to spread load across the per-IP G-Core budgets. See src/index.ts.
#
# Set in the Coolify resource env:
#   WG_EGRESS_IP_A / WG_EGRESS_IP_B  the two whitelisted source IPs
#   WG_EGRESS_BIND_ADDR              private docker gateway the app reaches (e.g. 10.0.1.1)
# Ports 18001/18002 are the URLs the app puts in WG_EGRESS_* on web + worker.
services:
  wg-egress-a:
    # Context is apps/proxy relative to the repo root: Coolify runs compose with
    # --project-directory at the repo root (Base Directory `/`), so a bare `.`
    # would look for the Dockerfile there and fail.
    build:
      context: apps/proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_IP: ${WG_EGRESS_IP_A}
      PORT: ${WG_EGRESS_PORT_A:-18001}
      BIND_ADDR: ${WG_EGRESS_BIND_ADDR:-10.0.1.1}
  wg-egress-b:
    build:
      context: apps/proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_IP: ${WG_EGRESS_IP_B}
      PORT: ${WG_EGRESS_PORT_B:-18002}
      BIND_ADDR: ${WG_EGRESS_BIND_ADDR:-10.0.1.1}
