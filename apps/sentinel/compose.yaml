# Coolify "Docker Compose" resource. One container that watches the web's health
# and decides whether the site's Cloudflare challenge should be on.
#
# It needs the Docker socket because its signal (the web's event-loop stalls) is
# in that container's log and nowhere else. Read-only, and the API token it
# carries can do exactly one thing on exactly one zone, so the blast radius of
# both is small and deliberate.
#
# Set in the Coolify resource env:
#   CLOUDFLARE_API_TOKEN     scoped to Zone WAF: Edit on unicum.gg only
#   CLOUDFLARE_ZONE_ID       the unicum.gg zone
#   CLOUDFLARE_RULESET_ID    the http_request_firewall_custom entrypoint
#   CLOUDFLARE_RULE_ID       the challenge rule
#   WEB_CONTAINER_PREFIX     the web resource's uuid, which survives redeploys
#                            (the trailing timestamp does not)
#   SENTINEL_MODE            observe (default) or enforce
services:
  sentinel:
    # Context is apps/sentinel relative to the repo root, like apps/proxy:
    # Coolify runs compose with --project-directory at the repo root.
    build:
      context: apps/sentinel
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SENTINEL_MODE: ${SENTINEL_MODE:-observe}
      WEB_CONTAINER_PREFIX: ${WEB_CONTAINER_PREFIX}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_RULESET_ID: ${CLOUDFLARE_RULESET_ID}
      CLOUDFLARE_RULE_ID: ${CLOUDFLARE_RULE_ID}
      # Passed through with no fallback of their own, deliberately. A default
      # written here as well as in the code is two numbers that must agree, and
      # when they stop agreeing this one wins silently: the threshold was raised
      # from 3 to 6 in index.ts on 13 October and the sentinel kept running at 3,
      # because compose was still handing it the old value. Unset reaches the
      # code as an empty string, which its `Number(...) || default` reads as
      # absent, so the code stays the single place the numbers live and Coolify
      # can still override any of them.
      SENTINEL_POLL_SECONDS: ${SENTINEL_POLL_SECONDS:-}
      SENTINEL_WINDOW_MINUTES: ${SENTINEL_WINDOW_MINUTES:-}
      SENTINEL_STALL_THRESHOLD: ${SENTINEL_STALL_THRESHOLD:-}
      SENTINEL_SUSTAIN_READINGS: ${SENTINEL_SUSTAIN_READINGS:-}
      SENTINEL_CALM_MINUTES: ${SENTINEL_CALM_MINUTES:-}
      SENTINEL_WARMUP_SECONDS: ${SENTINEL_WARMUP_SECONDS:-}
